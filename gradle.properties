org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Dependency pins. The *_file_id values are CurseMaven coordinates; the mod
# versions beside them are what those files contain and are what the
# neoforge.mods.toml ranges are built from. Bump both deliberately, together,
# after re-checking the ladder against the new jars.
gearevolution_file_id=9122235
gearevolution_mod_version=1.3.0
# Tensura and ManasCore are Gear Evolution's required closure, not direct
# dependencies of this mod - no chain file names a tensura: item.
tensura_file_id=8793360
tensura_mod_version=2.0.1.3
manascore_file_id=8022425
architectury_file_id=8492726
cloth_config_file_id=5729127
geckolib_file_id=8893490
smartbrainlib_file_id=7055149
terrablender_file_id=6054947

# Traveler Tool Belt: the mod version inside the jar (1.0.4, what the
# neoforge.mods.toml range is built from) and its Modrinth maven coordinate.
# Pin by Modrinth *version id*, never by version number: the number
# 1.21.1-1.0.4 is shared by the Fabric and NeoForge releases, and Modrinth's
# maven resolves the number to the Fabric jar, which NeoForge cannot load.
traveler_tool_belt_version=1.0.4
traveler_tool_belt_mod_version=EWVsxqVa

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=tensura_tool_belt
mod_name=Tensura Tool Belt
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.1
mod_group_id=org.bitwisemadness.tensuratoolbelt
mod_authors=Bitwise Madness
mod_description=Lets Traveler Tool Belt's belts evolve, using the same EP ladder as the Lightman's Currency wallets: a belt worn into battle earns EP from your kills and upgrades to the next tier once it is full. Gear Evolution is optional - without it the belts work and craft exactly as Traveler Tool Belt ships them, they just do not progress.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
